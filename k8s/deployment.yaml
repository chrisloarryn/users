apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  labels:
    app: users-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
        - name: users-service
          image: CONFIG_LOCATION-docker.pkg.dev/CONFIG_PROJECT_ID/CONFIG_SERVICE/users-service:CONFIG_VERSION
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: users-service-secrets
                  key: datasource-url
            - name: DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: users-service-secrets
                  key: datasource-username
            - name: DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: users-service-secrets
                  key: datasource-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: users-service-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
